<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sling 2 Checklist</title>
<style>
  :root {
    --navy: #2f3b8f;
    --red: #e4452f;
    --yellow: #fbf4a6;
    --ink: #222;
    --action: #1f3c9e;
    --rule: #4a4a4a;
    --desk: #e6e6ea;
    --paper: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --desk: #1d1d22; }
  }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0;
    background: var(--desk);
    font-family: Calibri, "Segoe UI", Carlito, Arial, sans-serif;
    color: var(--ink);
  }

  .toolbar {
    max-width: 148mm; margin: 8mm auto 0; display: flex; gap: 10px;
    align-items: center; justify-content: space-between;
    font-size: 14px; color: CanvasText;
  }
  .toolbar button {
    font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--navy); background: var(--navy); color: #fff;
  }

  /* A5 sheet; wider inside margin for the spiral binding, mirrored on back pages */
  .page {
    width: 148mm; height: 210mm; margin: 8mm auto;
    background: var(--paper); color: var(--ink);
    padding: 8mm 8mm 8mm 15mm;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
    display: flex; flex-direction: column; overflow: hidden;
    font-size: var(--fs, 8.5pt);
  }
  .page.back { padding: 8mm 15mm 8mm 8mm; }

  .title {
    background: var(--red); color: #fff; text-align: center;
    font-weight: 700; font-size: 1.5em; padding: .15em 0; flex: none;
  }
  .cols {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; column-gap: 4mm;
  }
  .col { min-width: 0; }

  .h {
    background: var(--navy); color: #fff; text-align: center;
    font-weight: 700; font-size: 1.25em; padding: .25em .3em; margin-top: 1em;
  }
  .h.red { background: var(--red); }
  .col > .h:first-child { margin-top: 0; }

  .row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 2mm;
    border-bottom: .3mm solid var(--rule); padding: .3em .25em; line-height: 1.2;
  }
  .row .a { color: var(--action); font-weight: 700; text-align: right; }
  .row.mn .i { width: 1.8em; flex: none; }
  .row.mn .a { flex: 1; text-align: center; }

  .note, .warn, .sub {
    text-align: center; border-bottom: .3mm solid var(--rule);
    padding: .3em .25em; line-height: 1.2; font-weight: 700;
  }
  .note { background: var(--yellow); color: var(--navy); }
  .warn { color: #d0021b; font-size: 1.25em; }
  .sub { font-size: .95em; }
  .sub.red { color: var(--red); }

  @media print {
    @page { size: A5; margin: 0; }
    body { background: none; }
    .toolbar { display: none; }
    .page { margin: 0; box-shadow: none; break-after: page; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <span>Edit the text block at the bottom of this file, then print.</span>
  <button onclick="window.print()">Print / save as PDF</button>
</div>

<main id="out"></main>

<!--
  CHECKLIST SOURCE — edit this, not the HTML above.
  === Title      new page (title optional; second page onward is mirrored for binding)
  ---            jump to right-hand column
  # Text         navy section header
  #! Text        red section header
  > Text         small centred sub-label     >! Text   same, in red
  ! Text         yellow brief bar
  !! Text        big red warning (e.g. CLEAR PROP!)
  ~ M | Text     mnemonic row (letter left, text centred)
  Item | Action  normal row
-->
<script type="text/plain" id="checklist">
=== 8. Sling 2 Checklist
# 1. Before Start
Pre-Flight | Completed
MR & Running Sheet | Completed
Start Position | Suitable
Taxi Brief | Completed
Passenger Brief if req. | Completed
Harnesses | Secure
Park Brake | Reset ON
Fuel | Emptiest/Qty
Switches | OFF
Master | ON
EFIS Backup | ON
Strobe Light | ON
Circuit Breakers | Check
CHRG Light | ON
# 2. Engine Start
Electric Fuel Pump | On/Test
Ignition | Both ON
Choke (Cold Engine) | ON
Throttle | Set closed if cold, cracked ¼" if hot
!! CLEAR PROP!
Starter | Engage
Oil Pressure | Check
Choke | Slowly OFF
RPM | 2000
Electric Fuel Pump | OFF
EFIS | ON
Avionics and G5 | ON
CHRG Light | OFF
NAV Light | ON
Flaps | UP
---
# 3. After Start Checks
ATIS | Checked
Altimeter | Set Baro (QNH), check tolerance (±100ft)
Transponder | STBY
Radio | Check
Brakes | Check on taxi
Instruments | Check on taxi
#! Radio
AF CTAF (AFRU) | 118.10
AF ATIS | 120.90
AF AWIS (1 sec mic) | 128.40
AF Ground | 119.90
AF Tower (North) | 123.60
AF Tower (South) | 118.10
BN Centre | 125.70
Heck Field | 119.00
#! Transponder
Class D | 3000 + ALT
Class G | 1200 + ALT

===
# 4. Run Ups
>! Parked into Wind
Park Brake | ON
Oil Temp | Min 50°C
Fuel | Fullest Tank
RPM | 4000
Ignition Check | Max drop 300 rpm, max diff 115 rpm
Idle Check | Min. 1400 rpm
RPM | 2000
# 5. Pre Takeoff
Controls | Full, Free, Correct
Trim | Check & Set T/O
Flight Instruments | Check / Set
Ignition | Both ON
Electric Fuel Pump | ON
Engine Instruments | Green / Stable
Flaps | 1st Stage Verified
Radio | Correct Freq's
Landing Light | As required
Circuit Breakers | Check
Canopy/Harnesses | Secure
! Departure & Safety Take-off Brief
# 6. Holding Point Checks
~ M | Mixture
~ C | Compass
~ A | Altimeter
~ S | Switches
~ T³ | Transponder, Talk and Time
---
# 7. After Take-Off
> Above 300ft AGL
Positive Rate of Climb | Check
Temp's & Pressures | Green/Stable
Flaps | Retract NOT below 70
Trim | Set
# 8. Before Landing
! Arrival Brief
Brakes & Park Brake | Check & OFF
Undercarriage | Fixed
Mixture | Set
Fuel | Fullest tank, sufficient
Instruments | Check
Switches | As Required
Hatches/Harnesses | Secure
# 9. After Landing
Flaps | Retract
Electric Fuel Pump | OFF
Landing Light | OFF
Transponder | Set STBY
Trim | Set T/O
Radio | Freq / Transmit
# 10. Shutdown
Park Brake | SET
Flight Times | Recorded
Throttle | Idle
EFIS and EFIS BKUP | OFF
Avionics Master | OFF
Lights | OFF
G5 | OFF
Key | OUT
Master | OFF
Ignition | Left then Right OFF
</script>

<script>
(function () {
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const out = document.getElementById('out');
  const lines = document.getElementById('checklist').textContent.split('\n');
  let page, col, pageCount = 0;

  function newPage(title) {
    page = document.createElement('section');
    page.className = 'page' + (pageCount++ % 2 ? ' back' : '');
    if (title) page.insertAdjacentHTML('beforeend', `<div class="title">${esc(title)}</div>`);
    const cols = document.createElement('div');
    cols.className = 'cols';
    page.appendChild(cols);
    out.appendChild(page);
    newCol();
  }
  function newCol() {
    col = document.createElement('div');
    col.className = 'col';
    page.querySelector('.cols').appendChild(col);
  }
  const add = html => col.insertAdjacentHTML('beforeend', html);
  const split = s => { const i = s.indexOf('|'); return i < 0 ? [s.trim(), ''] : [s.slice(0, i).trim(), s.slice(i + 1).trim()]; };

  for (const raw of lines) {
    const l = raw.trim();
    if (!l) continue;
    if (l.startsWith('===')) { newPage(l.slice(3).trim()); continue; }
    if (!page) newPage('');
    if (l === '---') { newCol(); continue; }
    if (l.startsWith('#!')) add(`<div class="h red">${esc(l.slice(2).trim())}</div>`);
    else if (l.startsWith('#')) add(`<div class="h">${esc(l.slice(1).trim())}</div>`);
    else if (l.startsWith('>!')) add(`<div class="sub red">${esc(l.slice(2).trim())}</div>`);
    else if (l.startsWith('>')) add(`<div class="sub">${esc(l.slice(1).trim())}</div>`);
    else if (l.startsWith('!!')) add(`<div class="warn">${esc(l.slice(2).trim())}</div>`);
    else if (l.startsWith('!')) add(`<div class="note">${esc(l.slice(1).trim())}</div>`);
    else if (l.startsWith('~')) { const [i, a] = split(l.slice(1)); add(`<div class="row mn"><span class="i">${esc(i)}</span><span class="a">${esc(a)}</span></div>`); }
    else { const [i, a] = split(l); add(`<div class="row"><span class="i">${esc(i)}</span><span class="a">${esc(a)}</span></div>`); }
  }

  // Shrink text on any page whose columns overflow the sheet
  function fit() {
    document.querySelectorAll('.page').forEach(p => {
      let fs = 8.5;
      p.style.setProperty('--fs', fs + 'pt');
      const over = () => [...p.querySelectorAll('.col')].some(c => c.scrollHeight > p.querySelector('.cols').clientHeight + 1);
      while (over() && fs > 6) { fs -= 0.25; p.style.setProperty('--fs', fs + 'pt'); }
    });
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(fit);
})();
</script>
</body>
</html>
